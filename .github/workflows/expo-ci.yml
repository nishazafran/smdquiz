name: Expo CI

on:
  push:
    branches:
      - main
      - feature/products
  pull_request:
    branches:
      - main

jobs:
  expo-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export Expo web build
        run: npx expo export --platform web

